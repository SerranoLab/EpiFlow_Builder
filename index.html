  <title>Serrano Lab – Spectral Panel Builder</title>
  <style>
    /****************************************
     * 1) ROOT VARIABLES & BASIC RESET
    ****************************************/
    :root {
      /* --- Serrano Lab Colors --- */
      --blue-dark: #1F74AF;  /* PMS 2383 */
      --blue-light: #45C5E2; /* PMS 2198 */
      --orange-dark: #E05928; /* PMS 7579 */
      --orange-light: #F78E28;/* PMS 1495 */

      /* We'll use the dark blue as "primary", orange as "accent" */
      --primary: var(--blue-dark);
      --primary-dark: #164C73; /* slightly darker than #1F74AF for hover states */
      --accent: var(--orange-light);

      /* Supporting colors */
      --card-bg: #ffffff;
      --body-bg: #f8fafc;
      --text-color: #1e293b;
      --shadow: rgba(0, 0, 0, 0.1);
      --danger: #ef4444;
      --toast-bg: #334155;
      --gray-light: #e2e8f0;
      --gray-lighter: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--body-bg);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /****************************************
     * 2) TOP BANNER (LOGO + TITLE)
    ****************************************/
    .top-banner {
      width: 100%;
      padding: 1.5rem 0.5rem;
      background: linear-gradient(to right, var(--blue-dark), var(--blue-light));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    .lab-logo-wrapper {
      /* White circular background to make the logo stand out */
      background-color: #fff;
      border-radius: 50%;
      padding: 0.5rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    .lab-logo {
      width: 82px;
      height: 82px;
      border-radius: 5%;
      display: block;
    }
    .banner-text {
      text-align: left;
      color: #fff;
    }
    .banner-text h1 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .banner-text h2 {
      font-size: 1rem;
      font-weight: 400;
      opacity: 0.9;
    }

    /****************************************
     * 3) MAIN CONTAINER & CONTROL CARD
    ****************************************/
    .container {
      width: 100%;
      max-width: 1200px;
      margin-top: 1.5rem;
      margin-bottom: 3rem;
      padding: 0 1rem;
    }

    .panel-controls {
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px var(--shadow);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .panel-controls .top-row {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .top-row label {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-weight: 500;
    }
    .top-row input[type="text"] {
      padding: 0.5rem 1rem;
      border: 1px solid var(--gray-light);
      border-radius: 4px;
      width: 250px;
    }

    /* Module button row (similar to "Harmony Type") */
    .module-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .module-buttons button {
      background-color: #f1f5f9;
      border: 1px solid var(--gray-light);
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
      font-size: 0.9rem;
      border-radius: 4px;
    }
    .module-buttons button.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .module-buttons button:hover:not(.active) {
      background-color: #e2e8f0;
    }

    /****************************************
     * 4) ANTIBODY GRID
    ****************************************/
    .antibody-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }
    .ab-card {
      background-color: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 4px var(--shadow);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s;
      position: relative;
    }
    .ab-card:hover {
      transform: translateY(-3px);
    }
    .ab-card-content {
      padding: 1rem;
    }
    .ab-marker {
      font-weight: 600;
      margin-bottom: 0.2rem;
      font-size: 1rem;
    }
    .ab-module {
      display: inline-block;
      font-size: 0.8rem;
      background-color: var(--gray-lighter);
      padding: 2px 4px;
      border-radius: 3px;
      margin-bottom: 0.5rem;
    }
    .core {
      background-color: var(--orange-light);
      color: #fff;
      margin-left: 0.5rem;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .ab-details {
      font-size: 0.85rem;
      line-height: 1.3rem;
      margin-top: 0.5rem;
    }

    /* "Add"/"Remove" button in corner */
    .select-btn {
      position: absolute;
      top: 0;
      right: 0;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      background-color: var(--primary);
      color: #fff;
      border-radius: 0 0 0 6px;
      font-size: 0.85rem;
      border: none;
      outline: none;
      transition: background-color 0.2s;
    }
    .select-btn:hover {
      background-color: var(--primary-dark);
    }
    .selected .select-btn {
      background-color: var(--danger);
    }
    .selected .select-btn:hover {
      background-color: #dc2626;
    }

    /****************************************
     * 5) SELECTED PANEL + WARNINGS
    ****************************************/
    .selected-panel {
      margin-top: 2rem;
    }
    .selected-panel h3 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: var(--primary-dark);
    }
    .selected-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .selected-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--gray-lighter);
      border-left: 4px solid var(--orange-dark);
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .remove-btn {
      background: none;
      border: none;
      color: var(--orange-dark);
      font-weight: bold;
      cursor: pointer;
      margin-left: 0.5rem;
    }

    /* Conflict box */
    .warning-box {
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 0.5rem;
      min-height: 30px;
      margin-bottom: 1rem;
    }
    .warning {
      color: var(--danger);
      font-size: 0.88rem;
      margin-bottom: 0.3rem;
      font-weight: 600;
    }

    /* Buttons row at bottom */
    .bottom-buttons {
      display: flex;
      gap: 1rem;
    }
    .bottom-buttons button {
      padding: 0.5rem 1rem;
      border: none;
      background-color: var(--primary);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .bottom-buttons button:hover {
      background-color: var(--primary-dark);
    }

    /****************************************
     * 6) TOAST/ALERT FOR "COPIED!"
    ****************************************/
    .toast {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--toast-bg);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      box-shadow: 0 2px 4px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .toast.show {
      opacity: 1;
    }
  </style>

    /***********************************************
     * 2) STATE
     ***********************************************/
    let selectedIds = new Set(); // IDs of selected antibodies
    let activeModule = "All";
    let searchQuery = "";

    /***********************************************
     * 3) ON DOM LOAD => INITIALIZE
     ***********************************************/
    document.addEventListener("DOMContentLoaded", () => {
      buildModuleButtons();
      renderGrid();
      renderSelected();
      setupEventListeners();
    });

    function setupEventListeners() {
      // Search bar
      document.getElementById("searchInput")
              .addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
              });

      // Copy & Save as CSV
      document.getElementById("copyButton").addEventListener("click", copyPanel);
      document.getElementById("saveButton").addEventListener("click", saveAsCSV);
    }

    /***********************************************
     * 4) BUILD MODULE BUTTONS
     ***********************************************/
    function buildModuleButtons() {
      const mods = antibodies.map(a => a.module);
      let moduleSet = new Set();
      mods.forEach(m => {
        const splitted = m.split("|").map(x => x.trim());
        splitted.forEach(sub => moduleSet.add(sub));
      });
      const uniqueMods = ["All", ...moduleSet];
      const container = document.getElementById("moduleButtons");
      container.innerHTML = "";

      uniqueMods.forEach(m => {
        const btn = document.createElement("button");
        btn.textContent = m;
        btn.dataset.module = m;
        if (m === "All") btn.classList.add("active");
        btn.addEventListener("click", () => {
          activeModule = m;
          [...container.querySelectorAll("button")].forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderGrid();
        });
        container.appendChild(btn);
      });
    }

    /***********************************************
     * 5) RENDER THE ANTIBODY GRID
     ***********************************************/
    function renderGrid() {
      const abGrid = document.getElementById("abGrid");
      abGrid.innerHTML = "";

      // Filter
      const filtered = antibodies.filter(ab => {
        if (activeModule !== "All") {
          if (!ab.module.toLowerCase().includes(activeModule.toLowerCase())) {
            return false;
          }
        }
        const haystack = (ab.marker + ab.antibody + ab.catNo + ab.role + ab.conjugation + ab.module).toLowerCase();
        return haystack.includes(searchQuery);
      });

      // Create card
      filtered.forEach(ab => {
        const card = document.createElement("div");
        card.classList.add("ab-card");
        if (selectedIds.has(ab.id)) {
          card.classList.add("selected");
        }

        // Button
        const btn = document.createElement("button");
        btn.className = "select-btn";
        btn.textContent = selectedIds.has(ab.id) ? "Remove" : "Add";
        // If locked & selected => can't remove
        if (ab.locked && selectedIds.has(ab.id)) {
          btn.disabled = true;
        }
        btn.addEventListener("click", () => toggleSelect(ab.id));
        card.appendChild(btn);

        // Content
        const content = document.createElement("div");
        content.className = "ab-card-content";

        const markerEl = document.createElement("div");
        markerEl.className = "ab-marker";
        markerEl.textContent = ab.marker;

        const modSpan = document.createElement("span");
        modSpan.className = "ab-module";
        modSpan.textContent = ab.module;
        if (ab.module.includes("Core EpiFlow")) {
          const c = document.createElement("span");
          c.className = "core";
          c.textContent = "Core";
          modSpan.appendChild(c);
        }

        const details = document.createElement("div");
        details.className = "ab-details";
        details.innerHTML = `
          <div><strong>Antibody:</strong> ${ab.antibody}</div>
          <div><strong>Clone:</strong> ${ab.clone}</div>
          <div><strong>Conjugation:</strong> ${ab.conjugation}</div>
          <div><strong>Laser:</strong> ${ab.laser}</div>
          <div><strong>Catalog:</strong> ${ab.catNo}</div>
          <div><em>${ab.role}</em></div>
        `;

        content.appendChild(markerEl);
        content.appendChild(modSpan);
        content.appendChild(details);

        card.appendChild(content);
        abGrid.appendChild(card);
      });
    }

    /***********************************************
     * 6) TOGGLE SELECT
     ***********************************************/
    function toggleSelect(id) {
      const ab = antibodies.find(a => a.id === id);
      if (!ab) return;

      if (ab.locked && selectedIds.has(id)) {
        return; // cannot remove locked
      }
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      renderGrid();
      renderSelected();
    }

    /***********************************************
     * 7) RENDER SELECTED PANEL
     ***********************************************/
    function renderSelected() {
      const selList = document.getElementById("selectedList");
      const selectedArray = antibodies.filter(a => selectedIds.has(a.id));
      selList.innerHTML = "";

      checkConflicts(selectedArray);

      selectedArray.forEach(ab => {
        const row = document.createElement("div");
        row.className = "selected-item";
        row.textContent = ab.marker + " [" + ab.conjugation + "]";

        if (!ab.locked) {
          const removeBtn = document.createElement("button");
          removeBtn.className = "remove-btn";
          removeBtn.textContent = "x";
          removeBtn.onclick = () => {
            selectedIds.delete(ab.id);
            renderGrid();
            renderSelected();
          };
          row.appendChild(removeBtn);
        }
        selList.appendChild(row);
      });
    }

    /***********************************************
     * 8) CONFLICT CHECK
     ***********************************************/
    function checkConflicts(selectedArray) {
      const warningBox = document.getElementById("warningBox");
      warningBox.innerHTML = "";

      const byLaser = {};
      const byConjugation = {};

      selectedArray.forEach(ab => {
        if (!byLaser[ab.laser]) byLaser[ab.laser] = [];
        byLaser[ab.laser].push(ab);

        if (!byConjugation[ab.conjugation]) byConjugation[ab.conjugation] = [];
        byConjugation[ab.conjugation].push(ab);
      });

      let messages = [];

      Object.keys(byLaser).forEach(l => {
        if (byLaser[l].length > 1) {
          const items = byLaser[l].map(x => x.marker).join(", ");
          messages.push(`Laser conflict "${l}": ${items}`);
        }
      });

      Object.keys(byConjugation).forEach(c => {
        if (byConjugation[c].length > 1) {
          const items = byConjugation[c].map(x => x.marker).join(", ");
          messages.push(`Conjugation conflict "${c}": ${items}`);
        }
      });

      if (messages.length > 0) {
        messages.forEach(msg => {
          const p = document.createElement("p");
          p.className = "warning";
          p.textContent = msg;
          warningBox.appendChild(p);
        });
      }
    }

    /***********************************************
     * 9) COPY TO CLIPBOARD
     ***********************************************/
    function copyPanel() {
      const sel = antibodies.filter(a => selectedIds.has(a.id));
      if (!sel.length) return;

      let text = "Serrano Lab Selected Panel:\n";
      sel.forEach(ab => {
        text += `- ${ab.marker} [${ab.conjugation}], Laser: ${ab.laser}\n`;
      });

      navigator.clipboard.writeText(text)
        .then(() => showToast())
        .catch(err => console.error("Copy failed", err));
    }

    /***********************************************
     * 10) SAVE AS CSV (instead of JSON)
     ***********************************************/
    function saveAsCSV() {
      const sel = antibodies.filter(a => selectedIds.has(a.id));
      if (!sel.length) return;

      // Decide on CSV columns
      const headers = ["Marker","Antibody","Clone","Conjugation","Laser","Catalog","Role","Module"];
      let lines = [];
      lines.push(headers.join(",")); // header row

      sel.forEach(ab => {
        // Escape commas if needed => simplest approach: replace commas with semicolons or enclose in quotes
        function fixCsv(val) {
          if (!val) return "";
          // if it has a comma, wrap in quotes
          const needsQuotes = val.includes(",") || val.includes("\"");
          if (needsQuotes) {
            return "\"" + val.replace(/"/g, '""') + "\""; 
          }
          return val;
        }

        let row = [
          fixCsv(ab.marker),
          fixCsv(ab.antibody),
          fixCsv(ab.clone),
          fixCsv(ab.conjugation),
          fixCsv(ab.laser),
          fixCsv(ab.catNo),
          fixCsv(ab.role),
          fixCsv(ab.module)
        ].join(",");
        lines.push(row);
      });

      const csvStr = lines.join("\n");

      // Download as .csv
      const blob = new Blob([csvStr], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "serrano_panel.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    /***********************************************
     * 11) TOAST FOR "COPIED"
     ***********************************************/
    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }
  </script>
